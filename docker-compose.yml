# Bronze Boxing — full stack for a single droplet.
#   web (Caddy)  : serves the SPA + reverse-proxies /api, terminates HTTPS
#   api (Go)     : the Fiber API, internal only
#   mongo        : database, internal only, data persisted in a named volume
#
# Only the web service is exposed to the internet (80/443). The API and Mongo
# are reachable solely on the private compose network.
#
#   cp .env.example .env   # then edit
#   docker compose up -d --build
#
# Upgrading an existing droplet: back up first, then run the migrations — see
# DEPLOY.md ("Updating after a code change").

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    # A single-node replica set: MongoDB only runs multi-document
    # transactions (which every money and stock change uses) on a replica
    # set. With auth on, replica-set members must also share a keyfile; it is
    # generated once into its own volume. The official entrypoint drops
    # --replSet/--keyFile while it creates the root user on first boot.
    entrypoint:
      - bash
      - -c
      - |
        set -e
        if [ ! -s /keyfile/mongo.key ]; then
          openssl rand -base64 756 > /keyfile/mongo.key
        fi
        chown 999:999 /keyfile/mongo.key
        chmod 400 /keyfile/mongo.key
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /keyfile/mongo.key
    volumes:
      - mongo_data:/data/db
      - mongo_keyfile:/keyfile
    networks: [internal]
    healthcheck:
      # Initiates the replica set on first run (idempotent afterwards), then
      # reports healthy only once this node is the writable primary.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval "
          try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok };
          if (!db.hello().isWritablePrimary) { quit(1) }"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ./backend
      target: api
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${DB_NAME}?authSource=admin&replicaSet=rs0
      DB_NAME: ${DB_NAME}
      PORT: "8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      STUDIO_TZ: ${STUDIO_TZ:-Asia/Beirut}
      STUDIO_NAME: ${STUDIO_NAME:-Bronze Boxing Club}
      STUDIO_ADDRESS: ${STUDIO_ADDRESS:-}
      STUDIO_PHONE: ${STUDIO_PHONE:-}
    depends_on:
      mongo:
        condition: service_healthy
    networks: [internal]

  # Data migrations. NOT started by `up`: run explicitly after a backup —
  #   docker compose run --rm migrate -dry-run
  #   docker compose run --rm migrate
  # The API refuses to start while migrations are pending.
  migrate:
    build:
      context: ./backend
      target: migrate
    profiles: [ops]
    restart: "no"
    environment:
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${DB_NAME}?authSource=admin&replicaSet=rs0
      DB_NAME: ${DB_NAME}
      STUDIO_TZ: ${STUDIO_TZ:-Asia/Beirut}
    depends_on:
      mongo:
        condition: service_healthy
    networks: [internal]

  # One-off demo-data seeder. NOT started by `up` — it WIPES the database and
  # reloads demo data. Run explicitly:  docker compose --profile seed run --rm seed
  seed:
    build:
      context: ./backend
      target: seed
    profiles: [seed]
    restart: "no"
    environment:
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${DB_NAME}?authSource=admin&replicaSet=rs0
      DB_NAME: ${DB_NAME}
      STUDIO_TZ: ${STUDIO_TZ:-Asia/Beirut}
    depends_on:
      mongo:
        condition: service_healthy
    networks: [internal]

  # Scheduled backups (see ops/backup/backup.sh): a compressed archive of the
  # database every BACKUP_INTERVAL_HOURS into ./backups, encrypted when
  # BACKUP_PASSPHRASE is set, pruned after BACKUP_RETENTION_DAYS. Restore
  # with ./restore-backup.sh (always into a new database).
  backup:
    image: mongo:7
    restart: unless-stopped
    entrypoint: ["bash", "/ops/backup.sh"]
    environment:
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      DB_NAME: ${DB_NAME}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./ops/backup/backup.sh:/ops/backup.sh:ro
      - ./backups:/backups
    depends_on:
      mongo:
        condition: service_healthy
    networks: [internal]

  # Off-site copies of the ENCRYPTED backups to any rclone remote (S3,
  # Backblaze B2, SFTP to another machine…), configured entirely from .env
  # (RCLONE_CONFIG_OFFSITE_*). Opt in:  docker compose --profile offsite up -d
  backup-offsite:
    image: rclone/rclone:1
    profiles: [offsite]
    restart: unless-stopped
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          rclone copy /backups "$${BACKUP_REMOTE:?set BACKUP_REMOTE, e.g. offsite:bronze-backups}" --include "*.enc" --log-level INFO
          sleep $$(( $${BACKUP_INTERVAL_HOURS:-24} * 3600 ))
        done
    env_file: [.env]
    volumes:
      - ./backups:/backups:ro

  web:
    build:
      context: ./frontend
      args:
        VITE_DEMO: "false"
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks: [internal]
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mongo_data:
  mongo_keyfile:
  caddy_data:
  caddy_config:

networks:
  internal:
